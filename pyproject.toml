[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-learning"
version = "0.1.0"
description = "Learning project for an MCP server built with FastMCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentic_room>=0.1.0",
    "fastmcp>=4.0.11",
    "langchain>=1.4.3",
    "langchain-mcp-adapters>=0.3.1",
    "mcp>=2,<3",
]

[project.scripts]
mcp-learning = "main:main"

[tool.setuptools]
py-modules = ["main"]
